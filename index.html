<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a09">
    <meta name="description" content="A fast, brutal solo dungeon-crawl on the Moon. Pick a door, spend your air, get out alive.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dark Fort: Moon Devils</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <link rel="preload" href="assets/fonts/pirata-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/oswald-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-depth="1">
    <div class="grain" aria-hidden="true"></div>

    <!-- ============================== TITLE ============================== -->
    <section id="title" class="screen title-screen" aria-label="Title">
        <div class="moon" aria-hidden="true">
            <div class="crater c1"></div><div class="crater c2"></div><div class="crater c3"></div><div class="crater c4"></div>
        </div>
        <h1 class="logo"><span class="logo-dark">Dark Fort</span><span class="logo-sub">Moon Devils</span></h1>
        <p class="tagline">Pick a door. Spend your air. Get out alive.</p>
        <div class="title-menu">
            <button id="continueBtn" class="btn btn-primary" hidden data-action="continue"></button>
            <button id="newRunBtn" class="btn btn-primary" data-action="new">New descent</button>
            <button id="dailyBtn" class="btn" data-action="daily"></button>
            <div class="title-row">
                <button class="btn btn-small" data-action="graveyard"></button>
                <button class="btn btn-small" data-action="records"></button>
                <button class="btn btn-small" data-action="howto"></button>
            </div>
            <a class="title-link" href="reference.html">Pen &amp; paper rules</a>
        </div>
        <p class="title-foot" id="titleFoot"></p>
    </section>

    <!-- ============================== GAME =============================== -->
    <section id="game" class="screen game-screen" aria-label="Game" hidden>
        <header class="hud" id="hud">
            <div class="hud-top">
                <div class="depth-chip" id="depthChip"></div>
                <div class="hud-meta" id="hudMeta"></div>
                <button class="icon-btn" data-action="menu" aria-label="Menu"></button>
            </div>
            <div class="pools" id="pools"></div>
            <div class="o2-row">
                <div class="o2-meter" id="o2Meter" role="meter" aria-label="Oxygen">
                    <div class="o2-fill" id="o2Fill"></div>
                    <div class="o2-escape" id="o2Escape"></div>
                    <div class="o2-label" id="o2Label"></div>
                </div>
            </div>
            <div class="hud-bottom">
                <div class="xp" id="xp"></div>
                <div class="credits" id="credits"></div>
                <div class="statuses" id="statuses"></div>
            </div>
        </header>

        <main class="stage" id="stage" aria-live="polite"></main>

        <div class="dice-tray" id="diceTray" aria-hidden="true"></div>

        <footer class="dock" id="dock"></footer>

        <nav class="tabbar" id="tabbar">
            <button class="tab" data-action="pack"></button>
            <button class="tab" data-action="map"></button>
            <button class="tab" data-action="log"></button>
        </nav>
    </section>

    <!-- ============================== SHEETS ============================= -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-head">
            <h2 id="sheetTitle"></h2>
            <button class="icon-btn" data-action="closeSheet" aria-label="Close"></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
    </aside>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="icons.js"></script>
    <script src="game-data.js"></script>
    <script src="engine.js"></script>
    <script src="sfx.js"></script>
    <script src="ui.js"></script>
</body>
</html>
